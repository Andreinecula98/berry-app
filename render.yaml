services:
  - type: web
    name: berry-app-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: berry-app-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_USERNAME
        value: admin
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://YOUR-VERCEL-APP.vercel.app

databases:
  - name: berry-app-db
    plan: free
